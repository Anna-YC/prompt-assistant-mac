<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>提示词助手</title>
  <link rel="preload" href="../assets/fonts/AlibabaPuHuiTi-2-55-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="skills.css" />
</head>
<body data-edge="right" data-theme="light">
  <button id="handle" aria-label="展开提示词助手" title="悬停展开 · 单击固定 · 按住 Ctrl 可拖动位置">
    <svg class="handle-tab" viewBox="0 0 36 76" aria-hidden="true"><path class="handle-shell" d="M36 0H32V4Q32 8 28 8H5Q1 8 1 12V64Q1 68 5 68H28Q32 68 32 72V76H36Z"/><rect class="handle-accent" x="29" y="12" width="2.5" height="52" rx="1.25"/></svg>
    <svg class="handle-quote" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8v8c0 4-2.5 6.5-7 7v-3.5c2.4-.4 3.5-1.5 3.5-3.5H3V5Zm11 0h8v8c0 4-2.5 6.5-7 7v-3.5c2.4-.4 3.5-1.5 3.5-3.5H14V5Z"/></svg>
  </button>
  <section id="panel" aria-label="提示词图库">
    <aside class="rail">
      <div class="rail-brand" title="提示词助手"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h8v8c0 4-2.5 6.5-7 7v-3.5c2.4-.4 3.5-1.5 3.5-3.5H3V5Zm11 0h8v8c0 4-2.5 6.5-7 7v-3.5c2.4-.4 3.5-1.5 3.5-3.5H14V5Z" fill="currentColor"/></svg></div>
      <button id="btnNewPrompt" class="rail-settings rail-create" aria-label="新建常用提示词" title="新建常用提示词并保存到飞书"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新建</span></button>
      <nav id="tabRow" aria-label="内容类型"></nav>
      <div class="rail-bottom"><button id="btnSettings" class="rail-settings" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.3-2 .9-2.2-.6-2.5 4.3 1.6 1.7v2.3l-1.6 1.7 2.5 4.3 2.2-.6 2 .9.6 2.3h5l.6-2.3 2-.9 2.2.6 2.5-4.3-1.6-1.7v-2.3l1.6-1.7-2.5-4.3-2.2.6-2-.9-.6-2.3Z" transform="translate(0 -.75) scale(1 .94)"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></button></div>
    </aside>
    <main class="gallery">
      <header>
        <h1>提示词助手</h1>
        <div class="acts">
          <button id="btnPin" class="ibtn" aria-label="固定展开" aria-pressed="false" title="固定展开"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-3 3v3h10v-3l-3-3V3M12 15v6"/></svg></button>
          <button id="btnSync" class="ibtn" aria-label="立即同步" title="立即同步"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1a8 8 0 0 1 13 2L20 12M4 12l.9 3.9a8 8 0 0 0 13 2"/></svg></button>
          <button id="btnCollapse" class="ibtn" aria-label="收起面板" title="收起面板"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
        </div>
      </header>
      <label class="searchbox"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" autocomplete="off" aria-label="搜索提示词" placeholder="搜索提示词、风格、标签" /></label>
      <div class="filters">
        <select id="groupSelect" aria-label="内容类型"></select>
        <select id="subSelect" aria-label="细分分类"></select>
      </div>
      <div class="list-toolbar"><nav id="sortRow" aria-label="排序筛选"></nav><span id="resultCount"></span></div>
      <div id="list" class="list" aria-label="提示词列表"></div>
      <footer class="statusbar"><span class="status-dot"></span><span id="syncInfo" role="status"></span></footer>
    </main>
  </section>
  <dialog id="promptComposer" class="composer" aria-labelledby="composerTitle" aria-describedby="composerDescription">
    <form id="promptForm" method="dialog">
      <div class="composer-heading"><div><h2 id="composerTitle">新建常用提示词</h2><p id="composerDescription">保存到飞书，多台设备都能同步使用。</p></div><button id="composerClose" class="ibtn" type="button" aria-label="关闭新增表单"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
      <div class="composer-scroll"><fieldset id="composerFields" class="composer-fields">
        <div class="composer-field"><label for="promptSource">保存到</label><select id="promptSource" name="sourceId" required></select></div>
        <button id="composerSettings" class="composer-link hidden" type="button">去设置接入常用提示词表</button>
        <div id="legacyPrompts" class="composer-legacy hidden"><span id="legacyPromptCount"></span><button id="migratePrompts" type="button">一并迁移</button><small>成功写入飞书后保留云端记录，收藏和复制统计一同转移。</small></div>
        <div class="composer-field"><label for="promptTitle">标题 <span>必填</span></label><input id="promptTitle" name="title" maxlength="200" required autocomplete="off" placeholder="例如：文章润色、角色设定" /></div>
        <div class="composer-field"><label for="promptContent">提示词正文 <span>必填</span></label><textarea id="promptContent" name="content" rows="9" maxlength="50000" required placeholder="输入或粘贴常用提示词…"></textarea></div>
        <label class="composer-check"><input id="promptPinned" name="pinned" type="checkbox" checked /> 同时收藏并加入托盘快捷菜单</label>
      </fieldset></div>
      <div class="composer-footer"><p id="composerMessage" role="status" aria-live="polite"></p><div class="composer-buttons"><button id="composerCancel" type="button">取消</button><button id="saveCloudPrompt" class="composer-primary" type="submit">保存到飞书</button></div></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="panel.js"></script>
</body>
</html>
